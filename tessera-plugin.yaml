id: icon_button
version: 0.10.0
api: "0.9"
icon: gesture-tap-button
maintainer: psummo
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 12

permissions:
  home_assistant_actions: [script.turn_on, light.toggle, switch.toggle, input_boolean.toggle, fan.toggle, light.turn_on, light.turn_off, cover.set_cover_position, fan.set_percentage, fan.turn_off]

tiles:
  # A tile that is only an icon: tapping it runs a script of Home Assistant.
  - id: button
    name: tile_name
    icon: gesture-tap-button
    sizes: { min: 1x1, max: 4x4 }
    memory: 300
    domains: [script]
    example: tile_example
    preview: { title: "{name}" }
    options:
      - { id: icon, kind: choice, label: icon, hint: icon_hint, default: plus,
          choices: [{ value: plus, label: icon_plus }, { value: minus, label: icon_minus }, { value: chevron_up, label: icon_chevron_up }, { value: chevron_down, label: icon_chevron_down }, { value: arrow_up, label: icon_arrow_up }, { value: arrow_down, label: icon_arrow_down }, { value: fire, label: icon_fire }, { value: power, label: icon_power }, { value: play, label: icon_play }, { value: pause, label: icon_pause }, { value: stop, label: icon_stop }, { value: check, label: icon_check }, { value: close, label: icon_close }, { value: lock, label: icon_lock }, { value: lock_open, label: icon_lock_open }, { value: bell, label: icon_bell }, { value: home, label: icon_home }, { value: volume_plus, label: icon_volume_plus }, { value: volume_minus, label: icon_volume_minus }, { value: skip_next, label: icon_skip_next }, { value: skip_previous, label: icon_skip_previous }, { value: thermometer, label: icon_thermometer }, { value: thermostat, label: icon_thermostat }, { value: radiator, label: icon_radiator }, { value: snowflake, label: icon_snowflake }, { value: fan, label: icon_fan }, { value: lightbulb, label: icon_lightbulb }, { value: flash, label: icon_flash }, { value: script, label: icon_script }, { value: tap, label: icon_tap }, { value: ceiling_light, label: icon_ceiling_light }, { value: lamp, label: icon_lamp }, { value: floor_lamp, label: icon_floor_lamp }, { value: sofa, label: icon_sofa }, { value: bed, label: icon_bed }, { value: television, label: icon_television }, { value: speaker, label: icon_speaker }, { value: music_note, label: icon_music_note }, { value: door_closed, label: icon_door_closed }, { value: door_open, label: icon_door_open }, { value: window_shutter, label: icon_window_shutter }, { value: curtains, label: icon_curtains }, { value: coffee_maker, label: icon_coffee_maker }, { value: washing_machine, label: icon_washing_machine }, { value: water_percent, label: icon_water_percent }, { value: weather_sunny, label: icon_weather_sunny }, { value: car, label: icon_car }, { value: robot_vacuum, label: icon_robot_vacuum }] }
      - { id: icon_name, kind: text, label: icon_name, hint: icon_name_hint, default: "" }
      - { id: color, kind: choice, label: color, hint: color_hint, default: normal,
          choices: [{ value: normal, label: color_normal }, { value: accent, label: color_accent }, { value: busy, label: color_busy }, { value: alert, label: color_alert }, { value: good, label: color_good }, { value: purple, label: color_purple }, { value: cyan, label: color_cyan }] }
      - { id: border, kind: choice, label: border, hint: border_hint, default: none,
          choices: [{ value: none, label: border_none }, { value: accent, label: color_accent }, { value: busy, label: color_busy }, { value: alert, label: color_alert }, { value: good, label: color_good }, { value: purple, label: color_purple }, { value: cyan, label: color_cyan }] }
      - { id: border_width, kind: choice, label: border_width, hint: border_width_hint, default: thin,
          choices: [{ value: thin, label: border_thin }, { value: normal, label: border_normal }, { value: thick, label: border_thick }] }
      - { id: icon_size, kind: choice, label: icon_size, hint: icon_size_hint, default: normal,
          choices: [{ value: normal, label: size_normal }, { value: small, label: size_small }, { value: large, label: size_large }, { value: xlarge, label: size_xlarge }] }
      - { id: label, kind: text, label: label_text, hint: label_text_hint, default: "" }
  # The same, for a light, a switch, an input_boolean or a fan: a tap toggles it and the tile follows its state.
  - id: switch
    name: tile_name_switch
    icon: lightbulb
    sizes: { min: 1x1, max: 4x4 }
    memory: 300
    domains: [light, switch, input_boolean, fan]
