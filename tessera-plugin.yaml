      - { id: orientation, kind: choice, label: orientation, hint: orientation_hint, default: auto,
          choices: [{ value: auto, label: orient_auto }, { value: horizontal, label: orient_horizontal }, { value: vertical, label: orient_vertical }] }
      - { id: show_value, kind: toggle, label: show_value, hint: show_value_hint, default: false }
