    sizes: { min: 1x1, max: 4x4 }
    memory: 600
    domains: [cover]
    attributes: [brightness, current_position, percentage, supported_color_modes]
    example: tile_example_slider_cover
    preview: { title: "{name}" }
    options:
      - { id: icon_name, kind: text, label: icon_name, hint: icon_name_hint, default: "" }
      - { id: color, kind: choice, label: color, hint: color_hint, default: accent,
          choices: [{ value: normal, label: color_normal }, { value: accent, label: color_accent }, { value: busy, label: color_busy }, { value: alert, label: color_alert }, { value: good, label: color_good }, { value: purple, label: color_purple }, { value: cyan, label: color_cyan }] }
      - { id: orientation, kind: choice, label: orientation, hint: orientation_hint, default: auto,
